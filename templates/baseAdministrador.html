<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block stylesheets %}
    <link rel="stylesheet" href="{{ url_for('static', path='administrador.css') }}">
    {% endblock %}
    <link rel="icon" href="{{ url_for('static', path='favicon.png') }}" type="image/x-icon">
    <title>{% block title %}EvaJav Admin{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
</head>
<body>
    {% block nav %}
    <nav class="nav">
        <a href="/administrador" class="brand"><span>Evaluación Admin</span></a>
        
            <a class="nav-links" href="/gestionProfesores">Profesores</a>
            <a class="nav-links" href="/gestionEstudiantes">Estudiantes</a>
            <a class="nav-links" href="/gestionGrados">Grados</a>
            <a class="nav-links" href="/centroEstadistico">Estadísticas</a>
        
        <a href="/" class="btn auto sm ghost">Cerrar Sesión</a>
    </nav>
    {% endblock %}
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
    <footer class="foot">
        <span class="mono">Evaluación Docente &copy; 2026 — Panel de Administración</span>
    </footer>
</body>
</html>
