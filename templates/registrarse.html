{% extends "base.html" %}
{% block title %}Registrarse - EvaJav{% endblock %}
{% block content %}
<form action="/inicio-sesion" method="get">

<legend>Registro</legend>

    <div>

         <label for="username">Crea un correo </label>
         <input id="username" name="username" type="text" placeholder="Ej. correo@ejemplo.com" required>

    </div>

    <div>

    <label for="password">Crear contraseña</label>
    <input id="password" name="password" type="password" placeholder="Ej. javieram" required>

    </div>

     <button type="submit">Registrarse</button>

</fieldset>
     <p>¿Ya tienes una cuenta? <a href="/inicio-sesion">Inicia sesión aquí</a></p>


</form>
{% endblock %}
