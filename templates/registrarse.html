{% extends "base.html" %}
{% block title %}Registrarse - EvaJav{% endblock %}
{% block content %}

<script src="/static/js/red.js?v=9" defer></script>

<nav class="nav">
<div class="brand">Evaluación <span>Docente</span></div>
</nav>

<main class="wrap narrow">

<div class="card">
     <h2 class="center">Crear cuenta</h2>
     <p class="muted center">Esto garantiza que solo puedas votar una vez por profesor.</p>

     <form action="/registro" method="POST">
          <label for="nombre">Crear una cuenta</label>
          <input class="input" type="text" id="nombre" name="nombre" placeholder="Ej. ejemplo@javiera.com" required autofocus>

          <label for="apellido">Crea una contraseña</label>
          <input class="input" type="password" id="apellido" name="apellido" placeholder="Ej. javieram" required>

          <label for="grupo_id">Grupo</label>
               <select class="input" id="grupo_id" name="grupo_id" required>
                    <option value="" disabled selected>Selecciona tu grupo</option>
                    <option value="3">11-1</option>
                    <option value="1">11-2</option>
                    <option value="2">11-3</option>
                    <option value="3">11-4</option>
                    <option value="1">11-5</option>
                    <option value="2">11-6</option>
               </select>

     <button class="btn" type="submit">Guardar registro</button>
</form>

<p class="muted small center mt mb-0"><a href="/">Volver al ingreso</a></p>
</div>

</main>

<footer class="foot">Tus respuestas son anónimas: los reportes solo muestran promedios.</footer>

{% endblock %}
