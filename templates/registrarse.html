{% extends "base.html" %}
{% block title %}Registrarse - EvaJav{% endblock %}
{% block content %}
<form action="/inicio-sesion" method="get">
    <legend>Registro</legend>
    <label for="nombre">Usuario</label>
    <input id="nombre" name="nombre" type="text" placeholder="Documento" required>
    <label for="contrasenna">Contraseña</label>
    <input id="contrasenna" name="contrasenna" type="contrasenna" placeholder="Contraseña" required>
    <button type="submit">Registrarse</button>
</form>
{% endblock %}
